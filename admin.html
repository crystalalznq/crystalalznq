<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم - كرستال الزنقة 💎</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #f4f6f9; padding: 20px; direction: rtl; margin: 0; }
    .card { background: white; max-width: 500px; margin: 30px auto; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    h2 { text-align: center; color: #2c3e50; margin-top: 0; margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 6px; font-weight: bold; color: #34495e; font-size: 14px; }
    input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
    input:focus, select:focus { border-color: #8e44ad; outline: none; }
    button { background: #8e44ad; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { background: #732d91; }
    button:disabled { background: #bdc3c7; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="card">
    <h2>💎 كرستال الزنقة - إضافة منتج</h2>
    <form id="addProductForm">
      
      <div class="form-group">
        <label>اسم المنتج:</label>
        <input type="text" id="pName" placeholder="مثال: خرز كريستال شفاف 8 مل" required>
      </div>

      <div class="form-group">
        <label>القسم:</label>
        <select id="pCategory">
          <option value="خرز">خرز</option>
          <option value="سلاسل صيني">سلاسل صيني</option>
          <option value="قوالب ريزين">قوالب ريزين</option>
          <option value="لولي">لولي</option>
          <option value="كريستال بلاستيك">كريستال بلاستيك</option>
          <option value="سلاسل بالمتر">سلاسل بالمتر</option>
        </select>
      </div>

      <div class="form-group">
        <label>السعر (جنيه):</label>
        <input type="number" id="pPrice" placeholder="50" required>
      </div>

      <div class="form-group">
        <label>حالة التوفر:</label>
        <select id="pStatus">
          <option value="متوفر">متوفر</option>
          <option value="كمية محدودة">كمية محدودة</option>
          <option value="غير متوفر">غير متوفر</option>
        </select>
      </div>

      <div class="form-group">
        <label>رابط صورة المنتج (مؤقتًا):</label>
        <input type="url" id="pImg" placeholder="https://..." required>
      </div>

      <button type="submit" id="saveBtn">حفظ المنتج في الداتا بيز 🚀</button>
    </form>
  </div>

  <!-- ربط الجافاسكريبت المباشر بدون فولدرات -->
  <script type="module" src="admin.js"></script>
</body>
</html>
