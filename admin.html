<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة تحكم كرستال الزنقة</title>
  <style>
    :root {
      --primary: #0284c7;
      --danger: #ef4444;
      --success: #22c55e;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; }

    .admin-container { width: 100%; max-width: 600px; }

    .header {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 20px;
      text-align: center;
    }
    .header h1 { font-size: 20px; color: var(--primary); margin-bottom: 5px; }

    .card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 20px;
    }

    .card-title {
      font-size: 16px; font-weight: bold; margin-bottom: 15px;
      border-bottom: 2px solid #f1f5f9; padding-bottom: 10px;
    }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 5px; color: #475569; }
    .form-group input { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; outline: none; font-size: 13px; }

    .btn { width: 100%; padding: 11px; border: none; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; }
    .btn-primary { background: var(--primary); color: #fff; }

    .list-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px; border: 1px solid var(--border); border-radius: 8px;
      margin-bottom: 8px; background: #fafafa;
    }
    .list-item-img { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; }
    .delete-btn { background: #fee2e2; color: var(--danger); border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; }

    .toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: var(--success); color: #fff; padding: 10px 20px;
      border-radius: 20px; font-size: 13px; font-weight: bold; display: none;
    }
  </style>
</head>
<body>

  <div class="admin-container">
    
    <div class="header">
      <h1>⚙️ لوحة تحكم المتجر</h1>
      <p>من هنا تقدر تضيف وتعدل الأقسام والعروض اللي بتظهر للزبائن</p>
    </div>

    <!-- 1. إدارة الأقسام -->
    <div class="card">
      <div class="card-title">📁 إدارة الأقسام الرئيسية</div>
      <form id="addCategoryForm">
        <div class="form-group">
          <label>اسم القسم</label>
          <input type="text" id="catName" placeholder="مثال: خرز كريستال" required>
        </div>
        <div class="form-group">
          <label>رابط صورة القسم (URL)</label>
          <input type="url" id="catImg" placeholder="https://example.com/image.jpg" required>
        </div>
        <button type="submit" class="btn btn-primary">إضافة القسم +</button>
      </form>

      <div class="item-list" id="adminCategoriesList" style="margin-top:15px;"></div>
    </div>

    <!-- 2. إدارة العروض -->
    <div class="card">
      <div class="card-title">🏷️ إدارة شريط العروض (السلايدر)</div>
      <form id="addOfferForm">
        <div class="form-group">
          <label>شارة العرض (Tag)</label>
          <input type="text" id="offerTag" placeholder="مثال: % خصم الجمعة" required>
        </div>
        <div class="form-group">
          <label>العنوان الرئيسي للعرض</label>
          <input type="text" id="offerTitle" placeholder="مثال: خصم 20%" required>
        </div>
        <div class="form-group">
          <label>التفاصيل / الوصف</label>
          <input type="text" id="offerSub" placeholder="مثال: على جميع أطقم اللولي" required>
        </div>
        <button type="submit" class="btn btn-primary">إضافة العرض +</button>
      </form>

      <div class="item-list" id="adminOffersList" style="margin-top:15px;"></div>
    </div>

  </div>

  <div class="toast" id="toastMsg">تم الحفظ بنجاح!</div>

  <script>
    const defaultCategories = [
      { id: "1", name: "الخرز", img: "https://i.ibb.co/6Rs3MZLZ/e7f71a17-b60d-4e0d-a74a-78bac99f5547-1.webp" },
      { id: "2", name: "السلاسل", img: "https://i.ibb.co/DH6pHZkL/1718558808temp199348012151161184.jpg" },
      { id: "3", name: "اللولي", img: "https://i.ibb.co/h117dx0S/FB-IMG-1726841760650.jpg" }
    ];

    const defaultOffers = [
      { id: "1", tag: "% خصومات هذا الأسبوع", title: "خصم 15%", subtitle: "على السلاسل" },
      { id: "2", tag: "% عرض خاص", title: "خصم 20%", subtitle: "على أطقم الخرز" }
    ];

    let categories = JSON.parse(localStorage.getItem('crystal_categories')) || defaultCategories;
    let offers = JSON.parse(localStorage.getItem('crystal_offers')) || defaultOffers;

    function showToast(msg) {
      const toast = document.getElementById("toastMsg");
      toast.innerText = msg;
      toast.style.display = "block";
      setTimeout(() => { toast.style.display = "none"; }, 2000);
    }

    function saveAndRender() {
      localStorage.setItem('crystal_categories', JSON.stringify(categories));
      localStorage.setItem('crystal_offers', JSON.stringify(offers));
      renderAdminCategories();
      renderAdminOffers();
    }

    function renderAdminCategories() {
      const container = document.getElementById("adminCategoriesList");
      container.innerHTML = "<h4 style='font-size:12px; margin-bottom:8px; color:#64748b;'>الأقسام الحالية:</h4>";
      categories.forEach((cat, idx) => {
        container.innerHTML += `
          <div class="list-item">
            <div style="display:flex; align-items:center; gap:10px;">
              <img src="${cat.img}" class="list-item-img" alt="${cat.name}">
              <div style="font-size:13px; font-weight:bold;">${cat.name}</div>
            </div>
            <button class="delete-btn" onclick="deleteCategory(${idx})">حذف</button>
          </div>
        `;
      });
    }

    function renderAdminOffers() {
      const container = document.getElementById("adminOffersList");
      container.innerHTML = "<h4 style='font-size:12px; margin-bottom:8px; color:#64748b;'>العروض الحالية:</h4>";
      offers.forEach((offer, idx) => {
        container.innerHTML += `
          <div class="list-item">
            <div>
              <div style="font-size:13px; font-weight:bold;">${offer.title} - ${offer.subtitle}</div>
              <div style="font-size:11px; color:#64748b;">${offer.tag}</div>
            </div>
            <button class="delete-btn" onclick="deleteOffer(${idx})">حذف</button>
          </div>
        `;
      });
    }

    document.getElementById("addCategoryForm").addEventListener("submit", function(e) {
      e.preventDefault();
      categories.push({ id: Date.now().toString(), name: document.getElementById("catName").value, img: document.getElementById("catImg").value });
      saveAndRender();
      showToast("تمت إضافة القسم بنجاح!");
      this.reset();
    });

    document.getElementById("addOfferForm").addEventListener("submit", function(e) {
      e.preventDefault();
      offers.push({ id: Date.now().toString(), tag: document.getElementById("offerTag").value, title: document.getElementById("offerTitle").value, subtitle: document.getElementById("offerSub").value });
      saveAndRender();
      showToast("تمت إضافة العرض بنجاح!");
      this.reset();
    });

    function deleteCategory(index) {
      categories.splice(index, 1);
      saveAndRender();
      showToast("تم حذف القسم");
    }

    function deleteOffer(index) {
      offers.splice(index, 1);
      saveAndRender();
      showToast("تم حذف العرض");
    }

    saveAndRender();
  </script>
</body>
</html>
