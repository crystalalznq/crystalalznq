<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>كرستال الزنقة - لوحة الإدارة والتحكم الاحترافية</title>
  <style>
    :root {
      --orange-btn: #d9531e;
      --orange-bg: #fdf5ef;
      --text-dark: #1e293b;
      --border-gray: #e2e8f0;
      --primary-blue: #0284c7;
      --admin-dark: #0f172a;
      --success-green: #10b981;
      --danger-red: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #f1f5f9; color: var(--text-dark); direction: rtl; display: flex; justify-content: center; padding: 20px 10px; }

    .admin-container {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      min-height: 95vh;
      padding: 15px;
      border-radius: 16px;
      box-shadow: 0 0 20px rgba(0,0,0,0.05);
    }

    .admin-header { background: var(--admin-dark); color: #fff; padding: 15px; border-radius: 14px; margin-bottom: 15px; text-align: center; }
    .admin-header h2 { font-size: 18px; font-weight: 800; margin-bottom: 4px; }
    .admin-header p { font-size: 11px; opacity: 0.8; }

    .admin-tabs { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 15px; scrollbar-width: none; }
    .admin-tabs::-webkit-scrollbar { display: none; }

    .tab-btn { flex: 0 0 auto; padding: 8px 14px; background: #e2e8f0; color: #334155; border: none; border-radius: 10px; font-size: 12px; font-weight: bold; cursor: pointer; }
    .tab-btn.active { background: var(--orange-btn); color: #fff; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .admin-card { background: #fff; border: 1px solid var(--border-gray); border-radius: 14px; padding: 15px; margin-bottom: 15px; }
    .admin-card-title { font-size: 14px; font-weight: 800; color: var(--admin-dark); margin-bottom: 12px; border-bottom: 2px solid var(--orange-bg); padding-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }

    .form-group { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
    .form-group label { font-size: 12px; font-weight: bold; color: #334155; }
    .form-group input { padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border-gray); outline: none; font-size: 13px; background: #fff; }

    .action-btn { background: var(--primary-blue); color: #fff; border: none; padding: 10px 15px; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 5px; }
    .action-btn.edit-mode { background: var(--success-green); }
    .cancel-edit-btn { background: #64748b; margin-top: 5px; display: none; }

    .admin-list-item { display: flex; align-items: center; justify-content: space-between; padding: 10px; border: 1px solid var(--border-gray); border-radius: 10px; margin-bottom: 8px; background: #fff; gap: 10px; }
    .admin-list-item img { width: 45px; height: 45px; border-radius: 8px; object-fit: cover; flex-shrink: 0; background: #f8fafc; }
    .admin-item-info { flex: 1; min-width: 0; overflow: hidden; }
    .admin-item-info h5 { font-size: 13px; color: #1e293b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
    .admin-item-info p { font-size: 11px; color: #64748b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    .item-actions { display: flex; gap: 4px; flex-shrink: 0; }
    .mini-btn { padding: 4px 8px; font-size: 10px; border-radius: 6px; border: none; cursor: pointer; color: #fff; font-weight: bold; }
    .btn-edit { background: var(--success-green); }
    .btn-delete { background: var(--danger-red); }

    .back-store-link { display: block; text-align: center; margin-top: 15px; font-size: 12px; color: var(--primary-blue); text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>

  <div class="admin-container">
    <div class="admin-header">
      <h2>🛠️ لوحة الإدارة والتحكم</h2>
      <p>إدارة منظمة، ذكية ومحمية لبيانات المتجر</p>
    </div>

    <div class="admin-tabs">
      <button class="tab-btn active" onclick="switchAdminTab('tabCategories', event)">🌸 الأقسام</button>
      <button class="tab-btn" onclick="switchAdminTab('tabTrending', event)">🔥 الأكثر مبيعاً</button>
      <button class="tab-btn" onclick="switchAdminTab('tabOffers', event)">🎁 العروض</button>
      <button class="tab-btn" onclick="switchAdminTab('tabSocial', event)">📞 التواصل</button>
    </div>

    <!-- تبويب الأقسام -->
    <div id="tabCategories" class="tab-content active">
      <div class="admin-card">
        <div class="admin-card-title" id="catCardTitle">➕ إضافة قسم جديد</div>
        <input type="hidden" id="editCatIndex" value="-1">
        <div class="form-group"><label>اسم القسم:</label><input type="text" id="newCatName" placeholder="مثال: أطواق هاند ميد"></div>
        <div class="form-group"><label>رابط الصورة:</label><input type="text" id="newCatImgUrl" placeholder="الصق رابط الصورة أو كود ImgBB هنا" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></div>
        <button class="action-btn" id="catSubmitBtn" onclick="saveCategory()">إضافة القسم</button>
        <button class="action-btn cancel-edit-btn" id="catCancelBtn" onclick="resetCategoryForm()">إلغاء التعديل</button>
      </div>
      <div class="admin-card">
        <div class="admin-card-title">📑 الأقسام الحالية</div>
        <div id="adminCategoriesList"></div>
      </div>
    </div>

    <!-- تبويب الأكثر مبيعاً -->
    <div id="tabTrending" class="tab-content">
      <div class="admin-card">
        <div class="admin-card-title" id="trendCardTitle">➕ إضافة منتج للأكثر مبيعاً</div>
        <input type="hidden" id="editTrendIndex" value="-1">
        <div class="form-group"><label>اسم المنتج:</label><input type="text" id="newTrendName" placeholder="مثال: لولي أبيض"></div>
        <div class="form-group"><label>السعر (جنيه):</label><input type="number" id="newTrendPrice" placeholder="50"></div>
        <div class="form-group"><label>رابط الصورة:</label><input type="text" id="newTrendImgUrl" placeholder="الصق رابط الصورة أو كود ImgBB هنا" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></div>
        <button class="action-btn" id="trendSubmitBtn" onclick="saveTrending()">إضافة المنتج</button>
        <button class="action-btn cancel-edit-btn" id="trendCancelBtn" onclick="resetTrendingForm()">إلغاء التعديل</button>
      </div>
      <div class="admin-card">
        <div class="admin-card-title">🔥 منتجات الأكثر مبيعاً الحالية</div>
        <div id="adminTrendingList"></div>
      </div>
    </div>

    <!-- تبويب العروض -->
    <div id="tabOffers" class="tab-content">
      <div class="admin-card">
        <div class="admin-card-title" id="offerCardTitle">➕ إضافة عرض جديد</div>
        <input type="hidden" id="editOfferIndex" value="-1">
        <div class="form-group"><label>شارة العرض (Tag):</label><input type="text" id="newOfferTag" placeholder="مثال: خصم خاص"></div>
        <div class="form-group"><label>عنوان العرض:</label><input type="text" id="newOfferTitle" placeholder="مثال: خصم 15%"></div>
        <div class="form-group"><label>الوصف:</label><input type="text" id="newOfferSub" placeholder="مثال: على السلاسل"></div>
        <div class="form-group"><label>رابط الصورة:</label><input type="text" id="newOfferImgUrl" placeholder="الصق رابط الصورة أو كود ImgBB هنا" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></div>
        <button class="action-btn" id="offerSubmitBtn" onclick="saveOffer()">إضافة العرض</button>
        <button class="action-btn cancel-edit-btn" id="offerCancelBtn" onclick="resetOfferForm()">إلغاء التعديل</button>
      </div>
      <div class="admin-card">
        <div class="admin-card-title">🎁 العروض النشطة</div>
        <div id="adminOffersList"></div>
      </div>
    </div>

    <!-- تبويب التواصل -->
    <div id="tabSocial" class="tab-content">
      <div class="admin-card">
        <div class="admin-card-title">✏️ تعديل وسائل التواصل</div>
        <div class="form-group"><label>رقم الواتساب:</label><input type="text" id="socialWa"></div>
        <div class="form-group"><label>رقم الموبايل:</label><input type="text" id="socialPhone"></div>
        <div class="form-group"><label>رقم الأرضي:</label><input type="text" id="socialLandline"></div>
        <div class="form-group"><label>رابط الفيسبوك:</label><input type="text" id="socialFb"></div>
        <div class="form-group"><label>رابط الانستجرام:</label><input type="text" id="socialInsta"></div>
        <div class="form-group"><label>رابط التيك توك:</label><input type="text" id="socialTiktok"></div>
        <button class="action-btn" onclick="saveSocialLinks()">حفظ التعديلات</button>
      </div>
    </div>

    <a href="index.html" class="back-store-link">🛍️ الانتقال إلى صفحة المتجر الرئيسية</a>
  </div>

  <script>
    let categoriesData = JSON.parse(localStorage.getItem('crystal_categories')) || [];
    let offersData = JSON.parse(localStorage.getItem('crystal_offers')) || [];
    let trendingData = JSON.parse(localStorage.getItem('crystal_trending')) || [];
    let socialData = JSON.parse(localStorage.getItem('crystal_social')) || {};

    function switchAdminTab(tabId, event) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById(tabId).classList.add('active');
    }

    // دالة ذكية لتنظيف رابط الصورة واستخراج الرابط لو المستخدم لصق كود HTML كامل
    function cleanImageUrl(rawInput) {
      let input = rawInput.trim();
      if (!input) return '';
      if (input.includes('<img') || input.includes('src=')) {
        const match = input.match(/src=["']([^"']+)["']/);
        if (match && match[1]) {
          return match[1];
        }
      }
      return input;
    }

    function renderAdminLists() {
      // 1. الأقسام
      const catList = document.getElementById('adminCategoriesList');
      let catHtml = '';
      categoriesData.forEach((cat, index) => {
        catHtml += `
          <div class="admin-list-item">
            ${cat.img ? `<img src="${cat.img}" onerror="this.style.display='none'">` : ''}
            <div class="admin-item-info">
              <h5>${escapeHtml(cat.name)}</h5>
            </div>
            <div class="item-actions">
              <button class="mini-btn btn-edit" onclick="editCategory(${index})">تعديل</button>
              <button class="mini-btn btn-delete" onclick="deleteCategory(${index}, '${escapeHtml(cat.name)}')">حذف</button>
            </div>
          </div>
        `;
      });
      catList.innerHTML = catHtml || '<p style="font-size:12px; color:#64748b; text-align:center; padding:10px;">لا توجد أقسام مضافة بعد</p>';

      // 2. الأكثر مبيعاً
      const trendList = document.getElementById('adminTrendingList');
      let trendHtml = '';
      trendingData.forEach((item, index) => {
        trendHtml += `
          <div class="admin-list-item">
            ${item.img ? `<img src="${item.img}" onerror="this.style.display='none'">` : ''}
            <div class="admin-item-info">
              <h5>${escapeHtml(item.name)}</h5>
              <p>${item.price} ج.م</p>
            </div>
            <div class="item-actions">
              <button class="mini-btn btn-edit" onclick="editTrending(${index})">تعديل</button>
              <button class="mini-btn btn-delete" onclick="deleteTrending(${index}, '${escapeHtml(item.name)}')">حذف</button>
            </div>
          </div>
        `;
      });
      trendList.innerHTML = trendHtml || '<p style="font-size:12px; color:#64748b; text-align:center; padding:10px;">لا توجد منتجات مضافة بعد</p>';

      // 3. العروض
      const offerList = document.getElementById('adminOffersList');
      let offerHtml = '';
      offersData.forEach((offer, index) => {
        offerHtml += `
          <div class="admin-list-item">
            ${offer.img ? `<img src="${offer.img}" onerror="this.style.display='none'">` : ''}
            <div class="admin-item-info">
              <h5>${escapeHtml(offer.title)}</h5>
              <p>${escapeHtml(offer.tag)} ${offer.subtitle ? '- ' + escapeHtml(offer.subtitle) : ''}</p>
            </div>
            <div class="item-actions">
              <button class="mini-btn btn-edit" onclick="editOffer(${index})">تعديل</button>
              <button class="mini-btn btn-delete" onclick="deleteOffer(${index}, '${escapeHtml(offer.title)}')">حذف</button>
            </div>
          </div>
        `;
      });
      offerList.innerHTML = offerHtml || '<p style="font-size:12px; color:#64748b; text-align:center; padding:10px;">لا توجد عروض نشطة بعد</p>';

      // 4. التواصل
      document.getElementById('socialWa').value = socialData.wa || '';
      document.getElementById('socialPhone').value = socialData.phone || '';
      document.getElementById('socialLandline').value = socialData.landline || '';
      document.getElementById('socialFb').value = socialData.fb || '';
      document.getElementById('socialInsta').value = socialData.insta || '';
      document.getElementById('socialTiktok').value = socialData.tiktok || '';
    }

    // تأمين النصوص ضد الثغرات (XSS Prevention)
    function escapeHtml(text) {
      if (!text) return '';
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    // --- منطق الأقسام ---
    function saveCategory() {
      const name = document.getElementById('newCatName').value.trim();
      const img = cleanImageUrl(document.getElementById('newCatImgUrl').value);
      const editIndex = parseInt(document.getElementById('editCatIndex').value);

      if(!name) return alert('أدخل اسم القسم من فضلك!');

      if (editIndex === -1) {
        categoriesData.push({ id: Date.now().toString(), name, img });
      } else {
        categoriesData[editIndex].name = name;
        categoriesData[editIndex].img = img;
        resetCategoryForm();
      }
      saveAndSync();
      document.getElementById('newCatName').value = '';
      document.getElementById('newCatImgUrl').value = '';
    }

    function editCategory(i) {
      const cat = categoriesData[i];
      document.getElementById('newCatName').value = cat.name;
      document.getElementById('newCatImgUrl').value = cat.img || '';
      document.getElementById('editCatIndex').value = i;
      document.getElementById('catCardTitle').innerText = '✏️ تعديل القسم';
      document.getElementById('catSubmitBtn').innerText = 'حفظ التعديل';
      document.getElementById('catSubmitBtn').classList.add('edit-mode');
      document.getElementById('catCancelBtn').style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetCategoryForm() {
      document.getElementById('newCatName').value = '';
      document.getElementById('newCatImgUrl').value = '';
      document.getElementById('editCatIndex').value = -1;
      document.getElementById('catCardTitle').innerText = '➕ إضافة قسم جديد';
      document.getElementById('catSubmitBtn').innerText = 'إضافة القسم';
      document.getElementById('catSubmitBtn').classList.remove('edit-mode');
      document.getElementById('catCancelBtn').style.display = 'none';
    }

    function deleteCategory(i, name) { 
      if(confirm(`هل أنت متأكد من حذف القسم "${name}"؟`)) { 
        categoriesData.splice(i, 1); 
        resetCategoryForm();
        saveAndSync(); 
      } 
    }

    // --- منطق الأكثر مبيعاً ---
    function saveTrending() {
      const name = document.getElementById('newTrendName').value.trim();
      const price = parseFloat(document.getElementById('newTrendPrice').value);
      const img = cleanImageUrl(document.getElementById('newTrendImgUrl').value);
      const editIndex = parseInt(document.getElementById('editTrendIndex').value);

      if(!name || isNaN(price)) return alert('أدخل اسم المنتج والسعر بشكل صحيح!');
      if(price <= 0) return alert('السعر يجب أن يكون أكبر من صفر!');

      if (editIndex === -1) {
        trendingData.push({ id: 't' + Date.now(), name, price, img });
      } else {
        trendingData[editIndex].name = name;
        trendingData[editIndex].price = price;
        trendingData[editIndex].img = img;
        resetTrendingForm();
      }
      saveAndSync();
      document.getElementById('newTrendName').value = '';
      document.getElementById('newTrendPrice').value = '';
      document.getElementById('newTrendImgUrl').value = '';
    }

    function editTrending(i) {
      const item = trendingData[i];
      document.getElementById('newTrendName').value = item.name;
      document.getElementById('newTrendPrice').value = item.price;
      document.getElementById('newTrendImgUrl').value = item.img || '';
      document.getElementById('editTrendIndex').value = i;
      document.getElementById('trendCardTitle').innerText = '✏️ تعديل المنتج';
      document.getElementById('trendSubmitBtn').innerText = 'حفظ التعديل';
      document.getElementById('trendSubmitBtn').classList.add('edit-mode');
      document.getElementById('trendCancelBtn').style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetTrendingForm() {
      document.getElementById('newTrendName').value = '';
      document.getElementById('newTrendPrice').value = '';
      document.getElementById('newTrendImgUrl').value = '';
      document.getElementById('editTrendIndex').value = -1;
      document.getElementById('trendCardTitle').innerText = '➕ إضافة منتج للأكثر مبيعاً';
      document.getElementById('trendSubmitBtn').innerText = 'إضافة المنتج';
      document.getElementById('trendSubmitBtn').classList.remove('edit-mode');
      document.getElementById('trendCancelBtn').style.display = 'none';
    }

    function deleteTrending(i, name) { 
      if(confirm(`هل أنت متأكد من حذف المنتج "${name}"؟`)) { 
        trendingData.splice(i, 1); 
        resetTrendingForm();
        saveAndSync(); 
      } 
    }

    // --- منطق العروض ---
    function saveOffer() {
      const tag = document.getElementById('newOfferTag').value.trim();
      const title = document.getElementById('newOfferTitle').value.trim();
      const subtitle = document.getElementById('newOfferSub').value.trim();
      const img = cleanImageUrl(document.getElementById('newOfferImgUrl').value);
      const editIndex = parseInt(document.getElementById('editOfferIndex').value);

      if(!tag || !title) return alert('أدخل شارة وعنوان العرض!');

      if (editIndex === -1) {
        offersData.push({ id: 'o' + Date.now(), tag, title, subtitle, img });
      } else {
        offersData[editIndex].tag = tag;
        offersData[editIndex].title = title;
        offersData[editIndex].subtitle = subtitle;
        offersData[editIndex].img = img;
        resetOfferForm();
      }
      saveAndSync();
      document.getElementById('newOfferTag').value = '';
      document.getElementById('newOfferTitle').value = '';
      document.getElementById('newOfferSub').value = '';
      document.getElementById('newOfferImgUrl').value = '';
    }

    function editOffer(i) {
      const offer = offersData[i];
      document.getElementById('newOfferTag').value = offer.tag;
      document.getElementById('newOfferTitle').value = offer.title;
      document.getElementById('newOfferSub').value = offer.subtitle || '';
      document.getElementById('newOfferImgUrl').value = offer.img || '';
      document.getElementById('editOfferIndex').value = i;
      document.getElementById('offerCardTitle').innerText = '✏️ تعديل العرض';
      document.getElementById('offerSubmitBtn').innerText = 'حفظ التعديل';
      document.getElementById('offerSubmitBtn').classList.add('edit-mode');
      document.getElementById('offerCancelBtn').style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetOfferForm() {
      document.getElementById('newOfferTag').value = '';
      document.getElementById('newOfferTitle').value = '';
      document.getElementById('newOfferSub').value = '';
      document.getElementById('newOfferImgUrl').value = '';
      document.getElementById('editOfferIndex').value = -1;
      document.getElementById('offerCardTitle').innerText = '➕ إضافة عرض جديد';
      document.getElementById('offerSubmitBtn').innerText = 'إضافة العرض';
      document.getElementById('offerSubmitBtn').classList.remove('edit-mode');
      document.getElementById('offerCancelBtn').style.display = 'none';
    }

    function deleteOffer(i, title) { 
      if(confirm(`هل أنت متأكد من حذف العرض "${title}"؟`)) { 
        offersData.splice(i, 1); 
        resetOfferForm();
        saveAndSync(); 
      } 
    }

    // --- التواصل ---
    function saveSocialLinks() {
      socialData = {
        wa: document.getElementById('socialWa').value.trim(),
        phone: document.getElementById('socialPhone').value.trim(),
        landline: document.getElementById('socialLandline').value.trim(),
        fb: document.getElementById('socialFb').value.trim(),
        insta: document.getElementById('socialInsta').value.trim(),
        tiktok: document.getElementById('socialTiktok').value.trim()
      };
      saveAndSync();
      alert('✨ تم حفظ وسائل التواصل بنجاح!');
    }

    function saveAndSync() {
      localStorage.setItem('crystal_categories', JSON.stringify(categoriesData));
      localStorage.setItem('crystal_offers', JSON.stringify(offersData));
      localStorage.setItem('crystal_trending', JSON.stringify(trendingData));
      localStorage.setItem('crystal_social', JSON.stringify(socialData));
      renderAdminLists();
    }

    renderAdminLists();
  </script>
</body>
</html>
