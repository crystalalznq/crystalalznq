<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم - كرستال الزنقة</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 20px; background: #f8f9fa; direction: rtl; }
    .card { background: white; padding: 25px; border-radius: 12px; max-width: 450px; margin: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    h2 { color: #333; text-align: center; margin-bottom: 20px; }
    .group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
    input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
    button { background: #e91e63; color: white; border: none; padding: 12px; border-radius: 6px; width: 100%; font-size: 16px; cursor: pointer; font-weight: bold; }
    button:hover { background: #d81b60; }
  </style>
</head>
<body>

  <div class="card">
    <h2>✨ إضافة منتج جديد</h2>
    <form id="addProductForm">
      <div class="group">
        <label>اسم المنتج:</label>
        <input type="text" id="pName" placeholder="مثال: خرز كريستال شفاف" required>
      </div>

      <div class="group">
        <label>القسم:</label>
        <select id="pCategory">
          <option value="خرز">خرز</option>
          <option value="سلاسل صيني">سلاسل صيني</option>
          <option value="قوالب ريزين">قوالب ريزين</option>
          <option value="لولي">لولي</option>
        </select>
      </div>

      <div class="group">
        <label>السعر (جنيه):</label>
        <input type="number" id="pPrice" placeholder="50" required>
      </div>

      <div class="group">
        <label>رابط الصورة (حاليًا):</label>
        <input type="url" id="pImg" placeholder="https://..." required>
      </div>

      <button type="submit" id="saveBtn">حفظ المنتج 🚀</button>
    </form>
  </div>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
